[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*", "staticfiles", "media"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "manage.py", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
