{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#071b2f">
  <title>{{ status_code }} — {{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/site.css' %}" rel="stylesheet">
  <link href="{% static 'css/foundation.css' %}" rel="stylesheet">
  <link href="{% static 'css/public_experience.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 site-body bg-light">
  <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <section class="card border-0 shadow-sm text-center w-100" aria-labelledby="error-title">
      <div class="card-body p-4 p-md-5">
        <span class="d-inline-flex align-items-center justify-content-center rounded-circle text-bg-primary fs-3 px-4 py-3 mb-4" aria-hidden="true"><i class="bi bi-exclamation-circle"></i></span>
        <p class="text-primary fw-semibold text-uppercase small mb-2">Error {{ status_code }}</p>
        <h1 class="display-6 fw-bold" id="error-title">{{ title }}</h1>
        <p class="text-muted mx-auto mb-4">{{ message }}</p>
        {% if request_id %}<div class="alert alert-light border d-inline-block text-start"><small class="text-muted d-block">Support reference</small><code>{{ request_id }}</code></div>{% endif %}
        <div class="d-flex flex-wrap gap-2 justify-content-center mt-4">
          <a class="btn btn-primary" href="/"><i class="bi bi-house-door me-1" aria-hidden="true"></i>Go to homepage</a>
          <a class="btn btn-outline-primary" href="/catalog/"><i class="bi bi-grid me-1" aria-hidden="true"></i>Browse catalogue</a>
          <a class="btn btn-outline-secondary" href="/contact/"><i class="bi bi-chat-dots me-1" aria-hidden="true"></i>Contact support</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
