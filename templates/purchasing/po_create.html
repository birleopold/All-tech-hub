{% extends "staff_base.html" %}
{% block title %}New PO{% endblock %}
{% block staff_content %}
<h1 class="h3 mb-3">New purchase order</h1>
<form method="post" class="card border-0 shadow-sm p-4">
  {% csrf_token %}
  {% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field.errors }}{{ field }}
  </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Create &amp; continue</button>
  <a class="btn btn-link" href="{% url 'staff_purchasing' %}">Cancel</a>
</form>
{% endblock %}
