{% extends "base.html" %}
{% block title %}New support request{% endblock %}
{% block content %}
<div class="container py-4 col-lg-6">
  <h1 class="h3 mb-3">New support request</h1>
  <p class="text-muted small">Describe your issue — we will email you when the status changes.</p>
  <form method="post" class="card border-0 shadow-sm">
    <div class="card-body">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Submit</button>
      <a class="btn btn-link" href="{% url 'portal_tickets' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
