{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}<section class="container py-5"><div class="card border-0 shadow-sm mx-auto" style="max-width: 36rem"><div class="card-body p-5"><h1 class="h3">Choose a new password</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100" type="submit">Save new password</button></form>{% else %}<p class="text-muted">This reset link has expired or has already been used.</p><a class="btn btn-primary" href="{% url 'portal_password_reset' %}">Request another link</a>{% endif %}</div></div></section>{% endblock %}
