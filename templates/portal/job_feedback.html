{% extends "base.html" %}
{% block title %}Feedback for {{ job.number }}{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h1 class="h3 mb-1">How did we do?</h1>
      <p class="text-muted mb-4">Your honest feedback helps us improve service for {{ job.number }}.</p>
      <form method="post" class="card border-0 shadow-sm">
        {% csrf_token %}
        <div class="card-body">
          <fieldset class="mb-3">
            <legend class="form-label">Rating</legend>
            <div class="d-flex gap-3 flex-wrap">
              {% for value in "54321" %}
              <label class="form-check d-flex align-items-center gap-2">
                <input class="form-check-input" type="radio" name="rating" value="{{ value }}" required>
                <span>
                  {% if value == "5" %}★★★★★ — Excellent{% endif %}
                  {% if value == "4" %}★★★★ — Good{% endif %}
                  {% if value == "3" %}★★★ — OK{% endif %}
                  {% if value == "2" %}★★ — Poor{% endif %}
                  {% if value == "1" %}★ — Awful{% endif %}
                </span>
              </label>
              {% endfor %}
            </div>
          </fieldset>
          <div class="mb-3">
            <label class="form-label" for="comment">Comments (optional)</label>
            <textarea class="form-control" name="comment" id="comment" rows="4" maxlength="2000" placeholder="What went well or could be better?"></textarea>
          </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between">
          <a class="btn btn-link" href="{% url 'portal_job_detail' job.pk %}">Cancel</a>
          <button class="btn btn-primary" type="submit">Submit feedback</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
