{% extends "base.html" %}
{% block title %}Reset your password{% endblock %}
{% block content %}
<section class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body p-4 p-lg-5">
<h1 class="h3 mb-2">Reset your password</h1><p class="text-muted">Enter the email address connected to your LEOSOFT customer account.</p>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="mb-3"><label for="{{ form.email.id_for_label }}" class="form-label">Email address</label>{{ form.email.errors }}<input type="email" name="email" class="form-control" id="{{ form.email.id_for_label }}" required autocomplete="email"></div><button class="btn btn-primary w-100" type="submit">Email reset link</button></form>
<p class="small mt-3 mb-0"><a href="{% url 'portal_login' %}">Back to customer sign in</a></p></div></div></div></div></section>
{% endblock %}
