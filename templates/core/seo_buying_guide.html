{% extends "core/buying_guide.html" %}
{% block title %}Technology buying guide | {{ company.company_name }}{% endblock %}
{% block meta %}
<meta name="description" content="Understand product condition, specifications, actual photographs, quotations, availability, delivery, documentation and after-sales support before buying technology.">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
<link rel="canonical" href="{{ seo_default_canonical_url }}">
<meta property="og:type" content="article">
<meta property="og:locale" content="{{ seo_og_locale|default:'en_UG' }}">
<meta property="og:site_name" content="{{ company.company_name }}">
<meta property="og:title" content="Technology buying guide | {{ company.company_name }}">
<meta property="og:description" content="A practical guide to choosing, confirming and buying computers and technology with confidence.">
<meta property="og:url" content="{{ seo_default_canonical_url }}">
{% if seo_default_image_url %}<meta property="og:image" content="{{ seo_default_image_url }}"><meta property="og:image:alt" content="Technology buying guide from {{ company.company_name }}">{% endif %}
<meta name="twitter:card" content="{% if seo_default_image_url %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:title" content="Technology buying guide | {{ company.company_name }}">
<meta name="twitter:description" content="A practical guide to choosing and confirming technology products with confidence.">
{% if seo_default_image_url %}<meta name="twitter:image" content="{{ seo_default_image_url }}"><meta name="twitter:image:alt" content="Technology buying guide from {{ company.company_name }}">{% endif %}
{% if seo_twitter_site %}<meta name="twitter:site" content="{{ seo_twitter_site }}">{% endif %}
{% endblock %}
