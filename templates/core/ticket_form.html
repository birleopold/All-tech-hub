{% extends "staff_base.html" %}
{% block title %}{% if object %}Edit ticket{% else %}New ticket{% endif %}{% endblock %}
{% block staff_content %}
<h1 class="h3 mb-3">{% if object %}Edit {{ object.reference }}{% else %}New support ticket{% endif %}</h1>
<form method="post" class="card border-0 shadow-sm col-lg-8">
  <div class="card-body">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{% if object %}{% url 'staff_ticket_detail' object.pk %}{% else %}{% url 'staff_tickets' %}{% endif %}">Cancel</a>
  </div>
</form>
{% endblock %}
