<form method="get" action="{% url 'product_list' %}" class="market-filter-form">
  {% if search_q %}<input type="hidden" name="q" value="{{ search_q }}">{% endif %}
  {% if current_sort %}<input type="hidden" name="sort" value="{{ current_sort }}">{% endif %}
  <div><label for="{{ id_prefix }}-kind">Product type</label><select class="form-select" id="{{ id_prefix }}-kind" name="kind"><option value="">Products and services</option><option value="physical" {% if current_kind == 'physical' %}selected{% endif %}>Physical products</option><option value="service" {% if current_kind == 'service' %}selected{% endif %}>Professional services</option></select></div>
  <div><label for="{{ id_prefix }}-category">Category</label><select class="form-select" id="{{ id_prefix }}-category" name="category"><option value="">All categories</option>{% for category in categories %}<option value="{{ category.slug }}" {% if current_category == category.slug %}selected{% endif %}>{{ category.name }}</option>{% for subcategory in category.subcategories.all %}<option value="{{ subcategory.slug }}" {% if current_category == subcategory.slug %}selected{% endif %}>— {{ subcategory.name }}</option>{% endfor %}{% endfor %}</select></div>
  <div><label for="{{ id_prefix }}-collection">Collection</label><select class="form-select" id="{{ id_prefix }}-collection" name="collection"><option value="">All collections</option>{% for collection in catalog_collections %}<option value="{{ collection.slug }}" {% if current_collection == collection.slug %}selected{% endif %}>{{ collection.label }}</option>{% endfor %}</select></div>
  {% if catalog_brands %}<div><label for="{{ id_prefix }}-brand">Brand</label><select class="form-select" id="{{ id_prefix }}-brand" name="brand"><option value="">All brands</option>{% for brand in catalog_brands %}<option value="{{ brand.brand }}" {% if current_brand == brand.brand %}selected{% endif %}>{{ brand.brand }} ({{ brand.product_count }})</option>{% endfor %}</select></div>{% endif %}
  <div><label for="{{ id_prefix }}-condition">Condition</label><select class="form-select" id="{{ id_prefix }}-condition" name="condition"><option value="">Any condition</option>{% for value,label in condition_choices %}<option value="{{ value }}" {% if current_condition == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div><label>Price range in {{ company.currency_code }}</label><div class="market-price-inputs"><input class="form-control" type="number" name="min_price" value="{{ current_min_price }}" min="0" step="1" placeholder="Minimum" aria-label="Minimum price"><input class="form-control" type="number" name="max_price" value="{{ current_max_price }}" min="0" step="1" placeholder="Maximum" aria-label="Maximum price"></div></div>
  <label class="form-check d-flex align-items-center gap-2"><input class="form-check-input mt-0" type="checkbox" name="available" value="1" {% if current_available %}checked{% endif %}><span class="small">Available to order or book</span></label>
  <button class="btn btn-primary" type="submit">Apply filters</button>
  {% if search_q or current_kind or current_category or current_sort or marketplace_filters_active %}<a class="btn btn-outline-secondary" href="{% url 'product_list' %}">Clear all filters</a>{% endif %}
</form>
