server {
    listen 80;
    listen [::]:80;
    server_name leosoftug.com www.leosoftug.com;

    client_max_body_size 25M;

    access_log /var/log/nginx/leosoftug.com.access.log;
    error_log /var/log/nginx/leosoftug.com.error.log;

    location /static/ {
        alias /home/admin/All-tech-hub/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/admin/All-tech-hub/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
