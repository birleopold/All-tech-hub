name: Django CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.lock

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django checks
        run: python manage.py check

      - name: Validate production settings and hashed static assets
        env:
          ALLTECH_ENV: production
          ALLTECH_SECRET_KEY: ci-only-secret-key-that-is-longer-than-fifty-characters-123456789
          ALLTECH_FIELD_ENCRYPTION_KEY: ci-only-field-encryption-key-longer-than-thirty-two-characters
          ALLTECH_ALLOWED_HOSTS: localhost
          ALLTECH_CSRF_TRUSTED_ORIGINS: https://localhost
          ALLTECH_DB_ENGINE: django.db.backends.sqlite3
          ALLTECH_DB_NAME: /tmp/leosoft-ci.sqlite3
        run: |
          python manage.py check --deploy
          python manage.py collectstatic --noinput
          python manage.py check_marketing_integrations

      - name: Run focused application tests
        run: >-
          python manage.py test
          automation
          growth.test_growth
          marketing.test_automation
          catalog.test_social_marketing
          catalog.test_watermarks
          catalog.test_discovery
          catalog.test_responsive_images
          catalog.test_experience
          commerce.test_progress
          portal.test_warranties
          core.test_api_experience
          core.test_phase1_security
          reliability

      - name: Run Ruff on changed Python scope
        run: |
          ruff check \
            automation/admin.py \
            automation/apps.py \
            automation/connectors.py \
            automation/models.py \
            automation/signals.py \
            automation/management/commands \
            automation/templatetags \
            automation/test_*.py \
            growth \
            reliability \
            marketing/forms.py \
            commerce/views.py \
            commerce/fulfillment.py \
            commerce/staff_views.py \
            commerce/progress.py \
            commerce/templatetags \
            commerce/test_progress.py \
            catalog/discovery.py \
            catalog/experience.py \
            catalog/responsive_images.py \
            catalog/templatetags \
            catalog/views.py \
            catalog/watermarks.py \
            catalog/signals.py \
            catalog/test_discovery.py \
            catalog/test_watermarks.py \
            catalog/test_responsive_images.py \
            catalog/test_experience.py \
            catalog/management/commands/watermark_product_images.py \
            catalog/management/commands/reprocess_product_images.py \
            catalog/management/commands/generate_product_image_variants.py \
            portal/warranty_views.py \
            portal/templatetags \
            portal/test_warranties.py \
            core/views.py \
            core/api_views.py \
            core/private_files.py \
            core/private_views.py \
            core/field_encryption.py \
            core/auth_views.py \
            core/test_api_experience.py \
            core/test_phase1_security.py \
            core/management/commands/backup_alltech.py \
            core/management/commands/verify_alltech_backup.py \
            core/management/commands/check_operational_health.py \
            core/management/commands/encrypt_staff_totp_secrets.py \
            marketing/services.py \
            marketing/public_urls.py \
            core/middleware.py \
            core/management/commands/bootstrap_roles.py \
            config/settings_base.py \
            config/settings_production.py \
            config/urls.py
          ruff check --ignore F401 automation/services.py

  transaction-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leosoft_ci
          POSTGRES_USER: leosoft_ci
          POSTGRES_PASSWORD: leosoft_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U leosoft_ci -d leosoft_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      ALLTECH_DB_ENGINE: django.db.backends.postgresql
      ALLTECH_DB_NAME: leosoft_ci
      ALLTECH_DB_USER: leosoft_ci
      ALLTECH_DB_PASSWORD: leosoft_ci_password
      ALLTECH_DB_HOST: 127.0.0.1
      ALLTECH_DB_PORT: 5432
      ALLTECH_SECRET_KEY: ci-transaction-secret-key-that-is-longer-than-fifty-characters-123456
      ALLTECH_FIELD_ENCRYPTION_KEY: ci-transaction-field-encryption-key-longer-than-thirty-two
      ALLTECH_ALLOWED_HOSTS: localhost
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.lock

      - name: Apply migrations on PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run transaction and customer experience tests on PostgreSQL
        run: >-
          python manage.py test
          reliability
          automation
          commerce
          catalog.test_experience
          portal.test_warranties
          core.test_api_experience
