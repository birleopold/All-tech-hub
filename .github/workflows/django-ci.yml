name: Django CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock

      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q -x '/migrations/' .
          node --check static/js/alltech_ui.js
          node --check static/js/pwa.js
          node --check static/js/marketing_analytics.js
          bash -n scripts/phase8_release_gate.sh
          bash -n scripts/final_release_closeout.sh
          python scripts/phase8_postgres_restore_drill.py --help >/dev/null
          node --check static/js/marketplace_experience.js
          node --check static/js/mobile_commerce_pro.js
          node --check static/js/job_handover_signature.js
          node --check static/js/field_notes_offline.js

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django checks
        run: python manage.py check

      - name: Validate production settings and hashed static assets
        env:
          ALLTECH_ENV: production
          ALLTECH_SECRET_KEY: ci-only-secret-key-that-is-longer-than-fifty-characters-123456789
          ALLTECH_FIELD_ENCRYPTION_KEY: ci-only-field-encryption-key-longer-than-thirty-two-characters
          ALLTECH_ALLOWED_HOSTS: localhost
          ALLTECH_CSRF_TRUSTED_ORIGINS: https://localhost
          ALLTECH_DB_ENGINE: django.db.backends.sqlite3
          ALLTECH_DB_NAME: /tmp/leosoft-ci.sqlite3
        run: |
          python manage.py check --deploy
          python manage.py collectstatic --noinput
          python manage.py check_marketing_integrations

      - name: Run focused application tests
        run: >-
          python manage.py test
          automation
          messaging.test_deliverability
          growth.test_growth
          growth.test_ambassador_payouts
          marketing.test_automation
          marketing.test_social_manual_confirm
          merchandising.test_merchant_feed_safety
          marketing.test_integrations
          marketing.test_attribution
          marketing.test_attribution_metrics
          automation.test_social_operator_experience
          automation.test_social_autopilot
          marketing.test_lead_pipeline
          customer_campaigns
          catalog.test_social_marketing
          catalog.test_watermarks
          catalog.test_discovery
          catalog.test_responsive_images
          catalog.test_experience
          catalog.test_product_ordering
          catalog.test_brand_facet_quality
          catalog.test_available_variant_price
          catalog.test_catalogue_journey_refinement
          core.test_homepage_engagement
          core.test_home_tech_ambient
          core.test_product_contact_experience
          core.test_storefront_polish
          commerce.test_progress
          commerce.test_customer_messages
          commerce.test_recommendations
          commerce.test_retention
          commerce.test_verified_order_reviews
          loyalty.test_loyalty
          loyalty.test_redemption
          purchasing.test_replenishment_policy
          purchasing.tests
          inventory.tests
          operations.test_job_expense_ledger
          billing.test_finance_controls
          billing.test_quote_revision_safety
          billing.test_quote_revision_experience
          operations.test_financial_reconciliation
          reports.test_field_finance_access
          reports.test_conversion
          reports.test_retention
          portal.test_warranties
          portal.test_service_hub
          dashboard.test_staff_command_centre
          core.test_foundation
          core.test_api_experience
          core.test_phase1_security
          core.test_phase8_backups
          core.test_postgres_restore_drill
          catalog.test_search_recovery
          operations.test_handover_workflow
          operations.test_handover_signature
          operations.test_offline_field_notes
          core.test_homepage_commerce_priority
          core.test_favicon_branding
          merchandising.test_merchant_readiness_visibility
          reliability

      - name: Run Ruff on maintained Python scope
        run: |
          ruff check \
            automation/admin.py \
            automation/apps.py \
            automation/connectors.py \
            automation/control.py \
            automation/forms.py \
            automation/models.py \
            automation/reporting.py \
            automation/signals.py \
            automation/staff_views.py \
            automation/worker.py \
            automation/management/commands \
            automation/templatetags \
            automation/test_*.py \
            messaging \
            customer_campaigns \
            growth \
            loyalty \
            reliability \
            marketing/forms.py \
            commerce/apps.py \
            commerce/cart.py \
            commerce/views.py \
            commerce/forms.py \
            commerce/fulfillment.py \
            commerce/staff_views.py \
            commerce/progress.py \
            commerce/customer_messages.py \
            commerce/recommendations.py \
            commerce/retention.py \
            commerce/retention_views.py \
            commerce/signals.py \
            commerce/management/commands \
            commerce/templatetags \
            commerce/test_progress.py \
            commerce/test_customer_messages.py \
            commerce/test_recommendations.py \
            commerce/test_retention.py \
            commerce/test_verified_order_reviews.py \
            reports/urls.py \
            reports/conversion.py \
            reports/conversion_views.py \
            reports/retention.py \
            reports/retention_views.py \
            reports/management/commands \
            reports/test_conversion.py \
            reports/test_retention.py \
            catalog/discovery.py \
            catalog/experience.py \
            catalog/responsive_images.py \
            catalog/templatetags \
            catalog/views.py \
            catalog/watermarks.py \
            catalog/signals.py \
            catalog/test_discovery.py \
            catalog/test_watermarks.py \
            catalog/test_responsive_images.py \
            catalog/test_experience.py \
            catalog/test_product_ordering.py \
            catalog/management/commands/watermark_product_images.py \
            catalog/management/commands/reprocess_product_images.py \
            catalog/management/commands/generate_product_image_variants.py \
            catalog/management/commands/audit_customer_experience.py \
            portal/warranty_views.py \
            portal/templatetags \
            portal/test_warranties.py \
            core/views.py \
            core/health.py \
            core/urls.py \
            core/api_views.py \
            core/private_files.py \
            core/private_views.py \
            core/field_encryption.py \
            core/auth_views.py \
            core/test_foundation.py \
            core/test_api_experience.py \
            core/test_phase1_security.py \
            core/test_storefront_polish.py \
            core/management/commands/backup_alltech.py \
            core/management/commands/verify_alltech_backup.py \
            core/management/commands/check_operational_health.py \
            core/management/commands/encrypt_staff_totp_secrets.py \
            marketing/services.py \
            marketing/public_urls.py \
            core/middleware.py \
            core/management/commands/bootstrap_roles.py \
            config/settings_base.py \
            config/settings_production.py \
            config/urls.py
          ruff check --ignore F401 automation/services.py

  transaction-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leosoft_ci
          POSTGRES_USER: leosoft_ci
          POSTGRES_PASSWORD: leosoft_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U leosoft_ci -d leosoft_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      ALLTECH_DB_ENGINE: django.db.backends.postgresql
      ALLTECH_DB_NAME: leosoft_ci
      ALLTECH_DB_USER: leosoft_ci
      ALLTECH_DB_PASSWORD: leosoft_ci_password
      ALLTECH_DB_HOST: 127.0.0.1
      ALLTECH_DB_PORT: 5432
      ALLTECH_SECRET_KEY: ci-transaction-secret-key-that-is-longer-than-fifty-characters-123456
      ALLTECH_FIELD_ENCRYPTION_KEY: ci-transaction-field-encryption-key-longer-than-thirty-two
      ALLTECH_ALLOWED_HOSTS: localhost
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock

      - name: Apply migrations on PostgreSQL
        run: python manage.py migrate --noinput

      - name: Validate operational commands
        run: |
          python manage.py run_growth_automation --dry-run --limit 5
          python manage.py audit_automation_control --strict
          python manage.py audit_email_deliverability --strict
          python manage.py run_customer_campaign_scheduler --dry-run --json
          python manage.py audit_customer_campaigns --strict

      - name: Run transaction and customer lifecycle tests on PostgreSQL
        run: >-
          python manage.py test
          reliability
          automation
          marketing.test_attribution
          marketing.test_attribution_metrics
          growth.test_growth
          billing.test_finance_controls
          billing.test_quote_revision_safety
          billing.test_quote_revision_experience
          operations.test_financial_reconciliation
          operations.test_job_expense_ledger
          purchasing.tests
          inventory.tests
          messaging.test_deliverability
          commerce
          customer_campaigns
          loyalty.test_loyalty
          reports.test_conversion
          reports.test_retention
          catalog.test_experience
          portal.test_warranties
          portal.test_service_hub
          dashboard.test_staff_command_centre
          core.test_foundation
          core.test_api_experience
